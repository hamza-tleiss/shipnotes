# ShipNotes frontend: nginx site config.
# Installed as /etc/nginx/conf.d/default.conf, which the image's main
# nginx.conf includes inside http {}. So this file holds a server {} only.
#
# Two jobs:
#   1. Serve the Vite build (dist/) as a single-page app.
#   2. Proxy /api/, /health and /ready to the api container.
# Because the React code calls RELATIVE paths (/api/notes, see src/api.ts),
# the same image works in dev, Compose, EC2 and Kubernetes: the proxy target
# is a hostname resolved at runtime, never a URL baked into the bundle.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Vite's JS/CSS shrink ~3x.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API and probes -> api service -------------------------------------
    # "api" is resolved by Docker's embedded DNS (Compose service name) or by
    # Kubernetes DNS (Service name). nginx resolves it once at startup, which
    # is why Compose starts the frontend only after the api is healthy.
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:3000;
    }

    location = /ready {
        proxy_pass http://api:3000;
    }

    # ---- Static files ------------------------------------------------------
    # Vite names bundles with a content hash (index-DB-BHu6O.js), so they can
    # be cached forever: a new build means a new file name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the hashed bundles, so it must NOT be cached by
    # the browser, or users keep an old shell pointing at deleted bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: a real file if it exists, otherwise index.html so that
    # React Router (or a refresh on /notes/42) does not produce a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
