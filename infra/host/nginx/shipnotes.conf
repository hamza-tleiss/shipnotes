# /etc/nginx/sites-available/shipnotes   (symlinked into /etc/nginx/sites-enabled/)
#
# One server block does two jobs:
#   1. serves the built React app (frontend/dist) from /var/www/shipnotes
#   2. reverse-proxies the API paths to Node on 127.0.0.1:3000
# Because the frontend calls RELATIVE paths (/api/..., /health), the same build
# works here, in Docker (Module 2) and in Kubernetes (Module 6).
#
# Always run `sudo nginx -t` before `sudo systemctl reload nginx`.

# A named upstream lets nginx keep idle connections open to Node (keepalive),
# which saves a TCP handshake per request.
upstream shipnotes_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    # With the "default" site removed this is the only server, so it also
    # answers http://localhost. server_name matters once several sites share port 80.
    server_name shipnotes.local localhost;

    root /var/www/shipnotes;
    index index.html;

    # Per-site logs: easier to grep than the shared access.log.
    access_log /var/log/nginx/shipnotes.access.log;
    error_log  /var/log/nginx/shipnotes.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API ---------------------------------------------------------------
    # No trailing slash after the upstream name: the URI is passed unchanged,
    # so /api/notes reaches Node as /api/notes. (With "http://shipnotes_api/"
    # nginx would strip the /api/ prefix and Node would answer 404.)
    location /api/ {
        proxy_pass http://shipnotes_api;
        include snippets/shipnotes-proxy.conf;
    }

    # "=" means exact match: only /health, not /healthz or /health/x.
    location = /health {
        proxy_pass http://shipnotes_api;
        include snippets/shipnotes-proxy.conf;
    }

    location = /ready {
        proxy_pass http://shipnotes_api;
        include snippets/shipnotes-proxy.conf;
    }

    # /metrics is deliberately NOT exposed. It is for Prometheus inside the
    # network (Module 9), not for the internet.
    location = /metrics {
        return 404;
    }

    # ---- Frontend ----------------------------------------------------------
    # Vite puts content-hashed files in /assets/. Their names change whenever
    # their content changes, so browsers may cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html so React can route them.
    # index.html itself must never be cached, or users keep an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
