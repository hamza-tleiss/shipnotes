# /etc/nginx/snippets/shipnotes-proxy.conf
# Shared proxy settings, included by every API location in shipnotes.conf.

# HTTP/1.1 with an empty Connection header is required for upstream keepalive.
proxy_http_version 1.1;
proxy_set_header Connection "";

# Tell the API who the real client is. Without these, Node only ever sees
# 127.0.0.1 (nginx) as the client address.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Fail fast if Node is down (502 after 5 s instead of hanging for 60 s).
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
